name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Em PR, um push novo torna o run anterior inútil. Em main/develop nunca cancela: o job de
  # migração não pode ser interrompido no meio.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Arquivos fora do gofmt (rode 'gofmt -w .'):"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  # Aplica todas as migrations num Postgres vazio, com pgvector, do mesmo jeito que produção aplica.
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clearhire
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/clearhire?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - name: Aplica todas as migrations num banco vazio
        run: bash scripts/migrate.sh

      - name: Segunda execução não reaplica nada
        run: |
          out=$(bash scripts/migrate.sh)
          echo "$out"
          if grep -q '^aplicando' <<<"$out"; then
            echo "migrate.sh reaplicou uma migration já registrada"
            exit 1
          fi

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # CD do banco. O deploy da aplicação é feito pelo Railway, que com "Wait for CI" só publica o
  # commit depois que este workflow inteiro passa — então a migração sempre roda ANTES do código
  # novo subir, e uma migração que falha barra o deploy.
  migrate-production:
    name: migrate-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, migrations, docker]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Aplica migrations pendentes no Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/migrate.sh
